name: release

on:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Check the tag matches the app version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != versionName $v"; exit 1; }
      - name: Decode the signing key
        env:
          VESPER_KEYSTORE_B64: ${{ secrets.VESPER_KEYSTORE_B64 }}
        run: echo "$VESPER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vesper.jks"
      - name: Build the signed APK
        env:
          VESPER_KEYSTORE: ${{ runner.temp }}/vesper.jks
          VESPER_KEYSTORE_PASSWORD: ${{ secrets.VESPER_KEYSTORE_PASSWORD }}
          VESPER_KEY_PASSWORD: ${{ secrets.VESPER_KEY_PASSWORD }}
          VESPER_KEY_ALIAS: vesper
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Vesper-${GITHUB_REF_NAME#v}.apk"
          python3 - "${GITHUB_REF_NAME#v}" <<'PY' > notes.md
          import re, sys
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(sys.argv[1]) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.S | re.M)
          print(m.group(1).strip() if m else '')
          PY
          gh release create "$GITHUB_REF_NAME" "Vesper-${GITHUB_REF_NAME#v}.apk" --title "Vesper ${GITHUB_REF_NAME#v}" --notes-file notes.md
